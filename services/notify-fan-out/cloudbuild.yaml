# cloudbuild.yaml for notify-fan-out service
# Builds, pushes, and deploys to Cloud Run
steps:
  # Build the Docker image
  - name: gcr.io/cloud-builders/docker
    args:
      [
        "build",
        "-f",
        "services/notify-fan-out/Dockerfile",
        "-t",
        "us-central1-docker.pkg.dev/$PROJECT_ID/notify-fan-out/notify-fan-out:$COMMIT_SHA",
        "-t",
        "us-central1-docker.pkg.dev/$PROJECT_ID/notify-fan-out/notify-fan-out:latest",
        "."
      ]

  # Push the image to Artifact Registry
  - name: gcr.io/cloud-builders/docker
    args:
      [
        "push",
        "us-central1-docker.pkg.dev/$PROJECT_ID/notify-fan-out/notify-fan-out:$COMMIT_SHA"
      ]

  - name: gcr.io/cloud-builders/docker
    args:
      [
        "push",
        "us-central1-docker.pkg.dev/$PROJECT_ID/notify-fan-out/notify-fan-out:latest"
      ]

  # Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "notify-fan-out",
        "--image",
        "us-central1-docker.pkg.dev/$PROJECT_ID/notify-fan-out/notify-fan-out:$COMMIT_SHA",
        "--region",
        "us-west1",
        "--project",
        "$PROJECT_ID",
        "--platform",
        "managed",
        "--allow-unauthenticated",
        "--port",
        "8080",
        "--memory",
        "512Mi",
        "--cpu",
        "1",
        "--min-instances",
        "0",
        "--max-instances",
        "10",
        "--timeout",
        "30s",
        "--concurrency",
        "80"
      ]

images:
  - "us-central1-docker.pkg.dev/$PROJECT_ID/notify-fan-out/notify-fan-out:$COMMIT_SHA"
  - "us-central1-docker.pkg.dev/$PROJECT_ID/notify-fan-out/notify-fan-out:latest"

options:
  logging: CLOUD_LOGGING_ONLY

